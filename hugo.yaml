baseURL: "https://blog.kotet.jp"
languageCode: "ja"
timeZone: "Asia/Tokyo"

title: "Kotet's Personal Blog"

taxonomies:
  tag: "tags"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    # スタイルは assets/sass/_chroma.scss 参照
    guessSyntax: true
    noClasses: false # インラインスタイルを使わない

hasCJKLanguage: true

DefaultContentLanguage: ja

enableGitInfo: true

Languages:
  en:
    params:
      description: "Kotetのサイト。主にブログ。"
      GoogleAnalytics: UA-88180620-1
  ja:
    params:
      description: "Kotetのサイト。主にブログ。"
      GoogleAnalytics: UA-88180620-1
