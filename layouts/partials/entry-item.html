{{ if isset .Params "tags" }}
<section class="entry-item">
    <h3>
        {{ partial "tag-link" (index .Params.tags 0) }}
        <a href="{{.Permalink}}">{{ .Title }}</a>
    </h3>
    <time>{{ .Date.Format "2006-01-02" }}</time>
    {{ range .Params.tags }} {{ partial "tag-link" . }} {{ end }}
</section>
{{ end }}
