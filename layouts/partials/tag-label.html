{{- /* タグ文字列を受け取り、ハッシュタグ風表記に使う表示名を返す。
       英語表記のタグは元データの文字列(小文字とアンダースコア)をそのまま使い、
       タグページが hashtag パラメータを持つ場合(日本語表記など)だけそれを優先する。 */ -}}
{{- $tag := . -}}
{{- $label := $tag -}}
{{- with site.GetPage (printf "/tags/%s" $tag) -}}
{{- $label = .Params.hashtag | default $tag -}}
{{- end -}}
{{- $label -}}
